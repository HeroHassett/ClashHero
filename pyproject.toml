[project]
name = "clashhero"
version = "0.1.0"
description = "Discord bot that reduces the managerial overhead of running Clash of Clans clans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "coc.py>=3.6",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
clashhero = "clashhero.__main__:main"
clashhero-check = "clashhero.healthcheck:main"
clashhero-emojis = "clashhero.services.emojis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clashhero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
